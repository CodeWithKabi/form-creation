<section class="login-page">
  <div class="login-shell">
    <aside class="login-brand-panel" aria-label="Task Manager">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">TM</span>
        <span class="brand-name">Task Manager</span>
      </div>

      <div class="brand-copy">
        <h2>Stay focused on what matters.</h2>
        <p>Create tasks, track progress, and keep pending work organized.</p>
      </div>
    </aside>

    <main class="login-card">
      <header class="login-header">
        <h1>Welcome back</h1>
        <p>Sign in to continue to your task dashboard.</p>
      </header>

      <form #loginForm="ngForm" class="login-form" (ngSubmit)="login()">
        <div class="form-group">
          <app-input
            label="Email address"
            type="email"
            [(value)]="email"
            (valueChange)="clearError()"
            placeholder="you@example.com"
            [required]="true"
            errorMessage="Enter a valid email address"
          />
        </div>

        <div class="form-group password-group">
          <app-input
            label="Password"
            [type]="showPassword ? 'text' : 'password'"
            [(value)]="password"
            (valueChange)="clearError()"
            placeholder="Enter your password"
            [required]="true"
            errorMessage="Password is required"
          />

          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword"
          >
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>

        @if (errorMessage) {
          <p class="form-error" role="alert">{{ errorMessage }}</p>
        }

        <app-button
          text="Sign in"
          (buttonClick)="login()"
          [disabled]="!email || !password || !isValidEmail"
        />

        <p class="register-text">
          Don't have an account?
          <a routerLink="/register">Create account</a>
        </p>
      </form>
    </main>
  </div>
</section>
