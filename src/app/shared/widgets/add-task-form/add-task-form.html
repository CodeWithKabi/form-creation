<div class="add-task-form">
  <h2>Create New Task</h2>

  <app-input
    label="Task Title"
    type="text"
    placeholder="Enter task title"
    [required]="true"
    [value]="taskTitle"
    (valueChange)="taskTitle = $event"
  >
  </app-input>
  <label>Description</label>
  <textarea
    placeholder="Enter task description"
    [(ngModel)]="description">
  </textarea>

  <app-input
    label="Due Date"
    type="date"
    [required]="true"
    [value]="dueDate"
    (valueChange)="dueDate = $event"
  >
  </app-input>
  <label>Priority</label>
  <select [(ngModel)]="priority">
    <option value="Low">Low</option>
    <option value="Medium">Medium</option>
    <option value="High">High</option>
  </select>
  <app-button text="Save Task" (buttonClick)="saveTask()"></app-button>
</div>
